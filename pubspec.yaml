name: app_upgrade_checker
description: "Check for a newer app version from the store (App Store / Google Play) or your own backend, and prompt users to update with a themeable full screen, dialog or bottom sheet."
version: 1.0.2
repository: https://github.com/AlaaKhaledAhmed/app_upgrade_checker
issue_tracker: https://github.com/AlaaKhaledAhmed/app_upgrade_checker/issues

# Discovery on pub.dev. Each topic is its own browsable page
# (pub.dev/packages?q=topic:update), so these are a search channel independent of
# the download-based popularity ranking.
#
# pub.dev allows a MAXIMUM OF 5 topics — lowercase, hyphens only, 2-32 chars.
# These five are the highest-traffic queries for this problem space. The words
# that did not fit (backend, dialog, bottom sheet) live in `description:` above,
# which the full-text search indexes as well.
topics:
  - update
  - upgrade
  - version
  - app-store
  - google-play

# Rendered as a gallery on the package page. Paths must resolve inside the
# published archive — screenshots/ is kept by .pubignore for exactly this reason.
screenshots:
  - description: "The Cosmic design as a full-screen update prompt"
    path: screenshots/cosmic.webp
  - description: "The Cosmic design with the version badge block enabled"
    path: screenshots/cosmic_badge.webp
  - description: "The Cosmic design with every content block enabled, including the what's-new list"
    path: screenshots/cosmic_full.webp
  - description: "The Cosmic design presented as a centered dialog"
    path: screenshots/cosmic_dialog.webp
  - description: "The Cosmic design presented as a bottom sheet"
    path: screenshots/cosmic_sheet.webp
  - description: "The RocketUp design as a full-screen update prompt"
    path: screenshots/rocket_up.webp
  - description: "The SuperHero design as a full-screen update prompt"
    path: screenshots/super_hero.webp

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

# This is a mobile-only package: the platform detection and store checks are
# designed for Android and iOS. It intentionally does not support web/desktop.
platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ">=9.0.0 <11.0.0"
  http: ^1.2.2
  url_launcher: ^6.3.2
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # To add assets to your package, add an assets section, like this:
   assets:
     - assets/image/
     - assets/lottie/
     - assets/fonts/

   # A two-weight fallback, subset to Arabic + Latin, so the designs keep their
   # intended look in an app that ships no font of its own. Callers who have
   # their own type pass `AppUpgradeTheme.fontFamily` and none of this is used.
   #
   # w600 is deliberately absent: only the badge asks for it, and it falls back
   # to Bold. Carrying a third file for one pill is not worth the bytes.
   fonts:
     - family: IBMP
       fonts:
         - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
           weight: 400

         - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
           weight: 700

