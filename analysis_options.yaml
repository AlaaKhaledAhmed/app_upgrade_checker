# Analyzer + linter config for app_upgrade — a package published on pub.dev.
#
# Tuned for a library rather than an app: the emphasis is on a stable, well
# documented public API and on the const-correctness that keeps a widget tree
# cheap in someone else's app.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true      # no implicit downcasts from dynamic
    strict-raw-types: true  # no bare List/Map in the public API

  exclude:
    - "**/build/**"
    - "example/build/**"

  errors:
    # A published package should ship without analyzer complaints, so anything
    # that is genuinely wrong is an error rather than a hint.
    todo: ignore
    deprecated_member_use_from_same_package: ignore

linter:
  rules:
    # ── Public API (matters because callers depend on it) ──
    #
    # `public_member_api_docs` is deliberately NOT enabled. It flags every
    # public member under lib/src/ too — 268 of them — but src/ is internal by
    # contract (the barrel's `show` lists are the real public surface), and
    # pana scores those hints as lint failures: turning it on drops static
    # analysis from 50/50 to 40/50. The exported API is documented by hand
    # instead; check new exports against `lib/app_upgrade.dart`.
    always_use_package_imports: true      # never a relative import inside lib/
    avoid_relative_lib_imports: true
    library_private_types_in_public_api: true
    avoid_returning_null_for_void: true
    use_to_and_as_if_applicable: true

    # ── Const correctness (this runs inside someone else's build method) ──
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true

    # ── Immutability ──
    prefer_final_locals: true
    prefer_final_fields: true
    prefer_final_in_for_each: true

    # ── Flutter widget hygiene ──
    use_key_in_widget_constructors: true
    sized_box_for_whitespace: true
    use_decorated_box: true
    use_colored_box: true
    avoid_unnecessary_containers: true
    use_build_context_synchronously: true  # this package awaits, then navigates

    # ── Async and resources ──
    await_only_futures: true
    unawaited_futures: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_slow_async_io: true

    # ── Strings ──
    prefer_interpolation_to_compose_strings: true
    use_string_buffers: true
    use_raw_strings: true

    # ── Redundancy ──
    avoid_redundant_argument_values: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    prefer_spread_collections: true
    prefer_inlined_adds: true
    avoid_function_literals_in_foreach_calls: true
    avoid_types_on_closure_parameters: true

    # ── Debug output: a package must never print into its host app's logs ──
    avoid_print: true

# Removed deliberately:
#   * the `custom_lint` plugin — it pointed at tools/thkel_lints/, which belongs
#     to a different project and is neither present here nor a dev_dependency.
#   * the `dart_code_metrics` block — that package is not a dependency, so the
#     thresholds were never enforced.
#   * the *.g.dart / *.freezed.dart / generated excludes — this package has no
#     code generation.
